[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalpel-ai"
version = "0.1.0"
description = "Scalpel: surgical model editing and bias mitigation platform. Isolates latent bias circuits with mechanistic interpretability and erases them with closed-form rank-one weight edits."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Scalpel AI" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
scalpel = "scalpel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scalpel = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
