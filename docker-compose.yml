services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scalpel
      POSTGRES_PASSWORD: scalpel
      POSTGRES_DB: scalpel
    ports:
      - "5432:5432"
    volumes:
      - scalpel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalpel -d scalpel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scalpel:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional when SCALPEL_PUBLIC_SIGNUP=1 (default). Set for bootstrap/admin keys.
      SCALPEL_API_KEYS: ${SCALPEL_API_KEYS:-}
      SCALPEL_TENANT_PLANS: ${SCALPEL_TENANT_PLANS:-}
      SCALPEL_DEFAULT_PLAN: ${SCALPEL_DEFAULT_PLAN:-enterprise}
      SCALPEL_MAX_CONCURRENT_JOBS: ${SCALPEL_MAX_CONCURRENT_JOBS:-1}
      SCALPEL_DEVICE: ${SCALPEL_DEVICE:-cpu}
      SCALPEL_ARTIFACT_DIR: /data/artifacts
      SCALPEL_DB_PATH: /data/scalpel.db
      # Durable signup accounts (Netlify-ready). Override with hosted Neon/Supabase URL in prod.
      DATABASE_URL: ${DATABASE_URL:-postgresql://scalpel:scalpel@db:5432/scalpel}
      SCALPEL_OPEN_KEYS: ${SCALPEL_OPEN_KEYS:-0}
      SCALPEL_REQUIRE_API_KEYS: ${SCALPEL_REQUIRE_API_KEYS:-1}
      SCALPEL_PUBLIC_SIGNUP: ${SCALPEL_PUBLIC_SIGNUP:-1}
      SCALPEL_SIGNUP_RATE_LIMIT: ${SCALPEL_SIGNUP_RATE_LIMIT:-10}
      SCALPEL_CORS_ORIGINS: ${SCALPEL_CORS_ORIGINS:-}
      SCALPEL_WEBHOOK_SECRET: ${SCALPEL_WEBHOOK_SECRET:-}
      SCALPEL_ALERT_WEAT_THRESHOLD: ${SCALPEL_ALERT_WEAT_THRESHOLD:-0.5}
    volumes:
      - scalpel-data:/data
      - hf-cache:/home/scalpel/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped

volumes:
  scalpel-data:
  scalpel-pg:
  hf-cache:
