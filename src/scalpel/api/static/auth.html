<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scalpel — __AUTH_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #14332F;
    --field: #516559;
    --cloud: #eeeee9;
    --bg: #000000;
    --panel: rgba(10, 12, 11, 0.72);
    --text: var(--cloud);
    --muted: #8a8a84;
    --line: rgba(238, 238, 233, 0.12);
    --err: #c4b8b0;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Outfit", ui-sans-serif, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100%;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
  }
  ::selection { background: rgba(81, 101, 89, 0.45); }

  .stage {
    position: relative;
    overflow: hidden;
    padding: clamp(1.5rem, 4vw, 2.5rem);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid var(--line);
    background:
      radial-gradient(ellipse 80% 60% at 30% 20%, rgba(20, 51, 47, 0.7), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(81, 101, 89, 0.22), transparent 55%),
      #000;
  }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(238,238,233,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(238,238,233,0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(135deg, #000 10%, transparent 70%);
    animation: drift 24s linear infinite;
  }
  .brand {
    position: relative;
    z-index: 1;
    font-weight: 600;
    letter-spacing: 0.28em;
    font-size: 0.78rem;
    text-transform: uppercase;
  }
  .brand a { color: inherit; text-decoration: none; }
  .brand i {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--field);
    margin-right: 0.5rem;
    vertical-align: middle;
  }
  .stage-copy {
    position: relative;
    z-index: 1;
    max-width: 22rem;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .stage-copy h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.1rem, 3.5vw, 2.85rem);
    line-height: 1.15;
    margin-bottom: 0.85rem;
  }
  .stage-copy h1 em { font-style: italic; color: #c8d0c6; }
  .stage-copy p {
    color: var(--muted);
    font-weight: 300;
    font-size: 0.98rem;
    line-height: 1.55;
  }
  .stage-foot {
    position: relative;
    z-index: 1;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
  }

  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1.5rem, 4vw, 3rem);
    background: #050605;
  }
  .card {
    width: min(100%, 400px);
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
  }
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1.75rem;
    border-bottom: 1px solid var(--line);
  }
  .tabs a {
    flex: 1;
    text-align: center;
    padding: 0.75rem 0.5rem;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .15s ease, border-color .15s ease;
  }
  .tabs a.active {
    color: var(--cloud);
    border-bottom-color: var(--field);
  }
  .tabs a:hover { color: var(--cloud); }

  h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.85rem;
    margin-bottom: 0.35rem;
  }
  .sub {
    color: var(--muted);
    font-weight: 300;
    font-size: 0.92rem;
    margin-bottom: 1.6rem;
  }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.4rem;
  }
  .field { margin-bottom: 1rem; }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  input {
    width: 100%;
    padding: 0.78rem 0.9rem;
    border-radius: 2px;
    border: 1px solid var(--line);
    background: rgba(0,0,0,0.45);
    color: var(--cloud);
    font: 400 0.95rem/1.3 var(--sans);
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input:focus {
    border-color: rgba(81, 101, 89, 0.85);
    background: rgba(20, 51, 47, 0.2);
  }
  input::placeholder { color: #555; }

  .btn {
    width: 100%;
    margin-top: 0.5rem;
    padding: 0.9rem 1rem;
    border: none;
    border-radius: 2px;
    background: var(--cloud);
    color: #0a0a0a;
    font: 500 0.88rem/1 var(--sans);
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease, opacity .15s ease;
  }
  .btn:hover { background: #fff; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.55; cursor: wait; transform: none; }

  .msg {
    margin-top: 1rem;
    padding: 0.75rem 0.85rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 0.85rem;
    color: var(--muted);
    display: none;
  }
  .msg.show { display: block; }
  .msg.err {
    border-color: rgba(196, 184, 176, 0.35);
    color: var(--err);
    background: rgba(66, 66, 66, 0.25);
  }
  .msg.ok {
    border-color: rgba(81, 101, 89, 0.5);
    color: var(--cloud);
    background: rgba(20, 51, 47, 0.35);
  }
  .foot {
    margin-top: 1.5rem;
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 300;
  }
  .foot a { color: var(--cloud); text-decoration: none; border-bottom: 1px solid rgba(238,238,233,0.25); }
  .foot a:hover { border-bottom-color: var(--cloud); }

  .signup-only[hidden], .login-only[hidden] { display: none !important; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes drift {
    from { transform: translateY(0); }
    to { transform: translateY(56px); }
  }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    .stage {
      min-height: 28vh;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .stage-foot { display: none; }
  }
</style>
</head>
<body data-mode="__AUTH_MODE__">
  <aside class="stage">
    <div class="brand"><a href="/"><i></i>Scalpel</a></div>
    <div class="stage-copy">
      <h1>Bias ops for teams that <em>ship</em> models.</h1>
      <p>One workspace. Tenant-isolated jobs. API keys that plug straight into the console and your pipeline.</p>
    </div>
    <div class="stage-foot">Surgical editing · audit reports · Hugging Face models</div>
  </aside>

  <main class="panel">
    <div class="card">
      <div class="tabs">
        <a id="tabLogin" href="/login">Log in</a>
        <a id="tabSignup" href="/signup">Sign up</a>
      </div>

      <h2 id="heading">Welcome back</h2>
      <p class="sub" id="subcopy">Enter your credentials to open the console.</p>

      <form id="form" autocomplete="on">
        <div class="row signup-only">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Alex Chen">
          </div>
          <div class="field">
            <label for="company">Company</label>
            <input id="company" name="company" type="text" autocomplete="organization" placeholder="Acme AI">
          </div>
        </div>
        <div class="field">
          <label for="email">Work email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn" type="submit" id="submit">Continue</button>
      </form>

      <div class="msg" id="msg" role="status"></div>
      <p class="foot" id="switch"></p>
    </div>
  </main>

<script>
const mode = document.body.dataset.mode === "signup" ? "signup" : "login";
const isSignup = mode === "signup";

document.getElementById("tabLogin").classList.toggle("active", !isSignup);
document.getElementById("tabSignup").classList.toggle("active", isSignup);
document.title = isSignup ? "Scalpel — Sign up" : "Scalpel — Log in";
document.getElementById("heading").textContent = isSignup ? "Create workspace" : "Welcome back";
document.getElementById("subcopy").textContent = isSignup
  ? "We'll provision a tenant and API key for your console."
  : "Enter your credentials to open the console.";
document.getElementById("submit").textContent = isSignup ? "Create account" : "Log in";
document.getElementById("password").autocomplete = isSignup ? "new-password" : "current-password";
document.querySelectorAll(".signup-only").forEach((el) => {
  el.hidden = !isSignup;
  el.querySelectorAll("input").forEach((inp) => { inp.required = isSignup; });
});
document.getElementById("switch").innerHTML = isSignup
  ? `Already have an account? <a href="/login">Log in</a>`
  : `New here? <a href="/signup">Create a workspace</a>`;

const form = document.getElementById("form");
const msg = document.getElementById("msg");
const submit = document.getElementById("submit");

function showMsg(text, kind) {
  msg.textContent = text;
  msg.className = "msg show " + (kind || "");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submit.disabled = true;
  showMsg(isSignup ? "Provisioning workspace…" : "Signing in…", "");
  const body = {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
  };
  if (isSignup) {
    body.name = document.getElementById("name").value.trim();
    body.company = document.getElementById("company").value.trim();
  }
  try {
    const res = await fetch(isSignup ? "/v1/auth/signup" : "/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = data.detail;
      const text = typeof detail === "string"
        ? detail
        : Array.isArray(detail)
          ? detail.map((d) => d.msg || JSON.stringify(d)).join("; ")
          : "Request failed";
      throw new Error(text);
    }
    localStorage.setItem("scalpel_key", data.api_key);
    localStorage.setItem("scalpel_user", data.name || data.email);
    localStorage.setItem("scalpel_tenant", data.tenant || "");
    localStorage.setItem("scalpel_plan", data.plan || "");
    showMsg("Connected. Opening console…", "ok");
    setTimeout(() => { location.href = "/app"; }, 450);
  } catch (err) {
    showMsg(err.message || "Something went wrong", "err");
    submit.disabled = false;
  }
});
</script>
</body>
</html>
