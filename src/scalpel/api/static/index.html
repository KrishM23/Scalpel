<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scalpel — Model Editing Console</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131824; --border: #232b3d; --text: #e6e9f0;
    --muted: #8b94a8; --accent: #5b8cff; --good: #34d399; --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 32px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: 0.5px; }
  header span { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 32px;
         display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 10px; padding: 20px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
              color: var(--muted); margin: 0 0 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input, select { width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: #0e1320; color: var(--text); }
  button { margin-top: 16px; width: 100%; padding: 10px; border: 0;
    border-radius: 6px; background: var(--accent); color: white;
    font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  tr.job { cursor: pointer; }
  tr.job:hover { background: #182034; }
  .status { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .status.queued    { background: #2a3350; color: var(--warn); }
  .status.running   { background: #2a3350; color: var(--accent); }
  .status.succeeded { background: #123527; color: var(--good); }
  .status.failed    { background: #3a1a1a; color: var(--bad); }
  #detail { margin-top: 24px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
  .metric { background: #0e1320; border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; }
  .metric .value { font-size: 22px; font-weight: 700; }
  .metric .label { font-size: 11px; color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  #error { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>SCALPEL</h1>
  <span>surgical model editing &amp; bias mitigation console</span>
</header>
<main>
  <section class="panel">
    <h2>New surgery</h2>
    <label>API key</label>
    <input id="apiKey" type="password" placeholder="sk_...">
    <label>Model</label>
    <select id="model"></select>
    <label>Bias benchmark</label>
    <select id="bias"></select>
    <label>Max circuit components</label>
    <input id="maxComponents" type="number" value="12" min="1" max="128">
    <button id="run">Run surgery</button>
    <div id="error"></div>
  </section>

  <section>
    <div class="panel">
      <h2>Edit jobs</h2>
      <table>
        <thead><tr><th>Job</th><th>Model</th><th>Bias</th><th>Status</th><th>Updated</th></tr></thead>
        <tbody id="jobs"><tr><td colspan="5" class="empty">Enter your API key to load jobs</td></tr></tbody>
      </table>
    </div>
    <div class="panel" id="detail" hidden>
      <h2>Audit report — <span id="detailId"></span></h2>
      <div class="metrics" id="detailMetrics"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const headers = () => ({ "X-API-Key": $("apiKey").value, "Content-Type": "application/json" });
let selectedJob = null;

$("apiKey").value = localStorage.getItem("scalpel_key") || "";
$("apiKey").addEventListener("change", () => {
  localStorage.setItem("scalpel_key", $("apiKey").value);
  loadCatalogs(); refresh();
});

async function api(path, options = {}) {
  const response = await fetch(path, { headers: headers(), ...options });
  if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
  return response.json();
}

async function loadCatalogs() {
  if (!$("apiKey").value) return;
  try {
    const [models, biases] = await Promise.all([api("/v1/models"), api("/v1/biases")]);
    $("model").innerHTML = models.map(m => `<option>${m.model_id}</option>`).join("");
    $("bias").innerHTML = biases.map(b => `<option>${b.name}</option>`).join("");
    $("error").textContent = "";
  } catch (err) { $("error").textContent = err.message; }
}

$("run").addEventListener("click", async () => {
  $("run").disabled = true; $("error").textContent = "";
  try {
    const job = await api("/v1/edit-jobs", { method: "POST", body: JSON.stringify({
      model_id: $("model").value,
      bias: $("bias").value,
      options: { max_components: parseInt($("maxComponents").value) || 12 },
    })});
    selectedJob = job.id;
    await refresh();
  } catch (err) { $("error").textContent = err.message; }
  $("run").disabled = false;
});

function pct(reduction) {
  const value = reduction.reduction_pct;
  const cls = value >= 0 ? "good" : "bad";
  return `<span class="${cls}">${value >= 0 ? "−" : "+"}${Math.abs(value).toFixed(1)}%</span>`;
}

async function showDetail(id) {
  selectedJob = id;
  try {
    const report = await api(`/v1/edit-jobs/${id}/report`);
    const m = report.metrics;
    $("detailId").textContent = id;
    $("detailMetrics").innerHTML = `
      <div class="metric"><div class="value">${pct(m.bias_reduction.mean_abs_association_gap)}</div>
        <div class="label">association gap (${m.bias_reduction.mean_abs_association_gap.before} → ${m.bias_reduction.mean_abs_association_gap.after})</div></div>
      <div class="metric"><div class="value">${pct(m.bias_reduction.weat_effect_size)}</div>
        <div class="label">WEAT effect size (${m.bias_reduction.weat_effect_size.before} → ${m.bias_reduction.weat_effect_size.after})</div></div>
      <div class="metric"><div class="value good">${(m.retention.embedding_cosine_retention * 100).toFixed(2)}%</div>
        <div class="label">embedding retention</div></div>
      <div class="metric"><div class="value">${report.surgery.num_edits}</div>
        <div class="label">rank-one edits applied</div></div>
      <div class="metric"><div class="value">${report.circuit.selected_components.map(c => c.label).join(", ")}</div>
        <div class="label">severed circuit components</div></div>
      <div class="metric"><div class="value">${report.runtime_seconds}s</div>
        <div class="label">surgery runtime</div></div>`;
    $("detail").hidden = false;
  } catch (err) { /* report not ready yet */ }
}

async function refresh() {
  if (!$("apiKey").value) return;
  try {
    const jobs = await api("/v1/edit-jobs");
    $("jobs").innerHTML = jobs.length ? jobs.map(job => `
      <tr class="job" onclick="showDetail('${job.id}')">
        <td>${job.id.slice(0, 12)}…</td><td>${job.model_id}</td><td>${job.bias_name}</td>
        <td><span class="status ${job.status}">${job.status}</span></td>
        <td>${new Date(job.updated_at).toLocaleTimeString()}</td>
      </tr>`).join("")
      : `<tr><td colspan="5" class="empty">No jobs yet — run your first surgery</td></tr>`;
    if (selectedJob) showDetail(selectedJob);
  } catch (err) { /* bad key; error surfaced elsewhere */ }
}

loadCatalogs();
refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
