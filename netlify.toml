# Scalpel marketing site on Netlify.
# Live surgery / signup / console are proxied to your Python API host.

[build]
  command = "python3 scripts/build_netlify.py"
  publish = "netlify-dist"

[build.environment]
  PYTHON_VERSION = "3.12"
  # Required for live demo + signup + /app (set in Netlify UI → Site settings → Env):
  # SCALPEL_API_ORIGIN = "https://your-api-host.example.com"

# Backup pretty-URL rewrites (primary _redirects is generated by the build).
[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200
[[redirects]]
  from = "/developers"
  to = "/developers.html"
  status = 200
[[redirects]]
  from = "/security"
  to = "/security.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200
